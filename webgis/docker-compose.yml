name: baumradar-webgis

# Docker-JSON-Logs sind ab Werk UNBEGRENZT — ein dauerhaft öffentlicher Web-Client
# (nginx-Access-Log!) oder ein gesprächiger GeoServer füllt sonst über Monate die
# Platte. Deckel je Dienst: 10 MB × 3 Dateien (rollierend) — Dauerbetriebs-sicher,
# ohne auf eine host-seitige daemon.json angewiesen zu sein.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Räumliche Datenbank: Bäume (Punkte) + Allergiezonen (gebufferte Polygone)
  postgis:
    image: postgis/postgis:17-3.5
    container_name: baumradar-postgis
    logging: *default-logging
    # Nach Host-Reboot/Absturz von selbst wiederkommen; nur `--down`/`docker stop`
    # gilt als bewusstes Aus. (Einmal-Jobs wie loader/graph-builder bleiben "no".)
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DB:-baumradar}
      POSTGRES_USER: ${PG_USER:-baumradar}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-baumradar}
    ports:
      # Nur lokal gebunden (Härtung): Admin-/DB-Ports gehören nicht ins LAN.
      # Für bewussten LAN-Zugriff BIND_HOST=0.0.0.0 in .env setzen.
      - "${BIND_HOST:-127.0.0.1}:${PG_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-baumradar} -d ${PG_DB:-baumradar}"]
      interval: 5s
      timeout: 3s
      retries: 24

  # OGC-Dienste: WMS 1.3.0, WFS 2.0, OGC API Features (Community-Extension)
  geoserver:
    # Mindestens 2.27: erst ab dort gibt es "ogcapi-features" als stabile Extension.
    image: docker.osgeo.org/geoserver:${GEOSERVER_VERSION:-2.28.0}
    container_name: baumradar-geoserver
    logging: *default-logging
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      GEOSERVER_ADMIN_USER: ${GEOSERVER_USER:-admin}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_PASSWORD:-geoserver}
      INSTALL_EXTENSIONS: "true"
      # OGC API Features ist seit GeoServer 2.25 eine stabile Extension
      # (Community-Module gäbe es nur als Nightly-Builds).
      STABLE_EXTENSIONS: "ogcapi-features"
      SKIP_DEMO_DATA: "true"
    ports:
      - "${BIND_HOST:-127.0.0.1}:${GEOSERVER_PORT:-8081}:8080"
    volumes:
      - gsdata:/opt/geoserver_data

  # Einmaliger Import: Katalog -> Signaturprüfung -> PostGIS -> GeoServer-Provisionierung.
  # Idempotent über dataVersion; erneutes `up` überspringt unveränderte Städte.
  loader:
    build: ./loader
    container_name: baumradar-loader
    logging: *default-logging
    depends_on:
      postgis:
        condition: service_healthy
      geoserver:
        condition: service_started
    environment:
      CATALOG_URL: ${CATALOG_URL:-https://raw.githubusercontent.com/matthili/BaumRadar/master/docs/data/catalog.json}
      CITY_FILTER: ${CITY_FILTER:-}
      PG_URL: jdbc:postgresql://postgis:5432/${PG_DB:-baumradar}
      PG_DB: ${PG_DB:-baumradar}
      PG_USER: ${PG_USER:-baumradar}
      PG_PASSWORD: ${PG_PASSWORD:-baumradar}
      GEOSERVER_URL: http://geoserver:8080/geoserver
      GEOSERVER_USER: ${GEOSERVER_USER:-admin}
      GEOSERVER_PASSWORD: ${GEOSERVER_PASSWORD:-geoserver}
      GEOSERVER_PG_HOST: postgis
      GEOSERVER_PG_PORT: "5432"
      SKIP_GEOSERVER: ${SKIP_GEOSERVER:-false}
      MAX_PARALLEL_IMPORTS: ${MAX_PARALLEL_IMPORTS:-4}
    restart: "no"

  # Angular-Client (OpenLayers) — nginx liefert die App aus und proxied
  # /geoserver same-origin an den GeoServer-Service (kein CORS nötig).
  web:
    build: ./client
    container_name: baumradar-web
    logging: *default-logging
    restart: unless-stopped
    depends_on:
      geoserver:
        condition: service_started
    environment:
      # Für die Status-Anzeige im Client: was SOLL dieser Stack laden?
      # Die Start-Skripte setzen die Werte passend zu den gewählten Profilen.
      STACK_ROUTING: ${STACK_ROUTING:-1}
      STACK_GEOCODING: ${STACK_GEOCODING:-1}
      CITY_FILTER: ${CITY_FILTER:-}
    ports:
      - "${WEB_PORT:-8082}:80"
    volumes:
      # Live-Status der Lade-Jobs (photon/graphhopper/graph-builder schreiben,
      # nginx serviert sie read-only unter /status/ an den Client).
      - statusdata:/webstatus:ro

  # --- Phase 4: Routing (nur mit `--profile routing`) ------------------------
  # Einmaliger Job: extrahiert die Stadt-BBoxen aus den DE/AT/CH-Geofabrik-PBFs
  # zu einem kleinen Insel-PBF. Die Länder-PBFs bleiben im osmcache-Volume.
  graph-builder:
    build: ./graph-builder
    container_name: baumradar-graph-builder
    logging: *default-logging
    profiles: ["routing"]
    environment:
      CATALOG_URL: ${CATALOG_URL:-https://raw.githubusercontent.com/matthili/BaumRadar/master/docs/data/catalog.json}
      CITY_FILTER: ${CITY_FILTER:-}
      BBOX_MARGIN_DEG: ${BBOX_MARGIN_DEG:-0.03}
      # Städte je osmium-Lauf: osmium braucht ~1,5 GB RAM je Stadt im Batch
      # (globale ID-Bitmap). 1 = läuft ab ~3 GB Docker-VM; größer = schneller.
      EXTRACT_BATCH: ${EXTRACT_BATCH:-1}
    volumes:
      - osmcache:/osm
      - routingdata:/data
      - statusdata:/status
    restart: "no"

  # Ein GraphHopper-Dienst (foot + bike), flexibler Modus: der Client schickt die
  # Allergiezonen pro Anfrage als Custom-Model-Block-Areas mit. Baut den Graph beim
  # ersten Start aus dem Insel-PBF (danach gecacht im routingdata-Volume).
  graphhopper:
    build:
      context: ./graphhopper
      args:
        GH_VERSION: ${GH_VERSION:-10.0}
    container_name: baumradar-graphhopper
    logging: *default-logging
    profiles: ["routing"]
    depends_on:
      graph-builder:
        condition: service_completed_successfully
    environment:
      JAVA_OPTS: ${GH_JAVA_OPTS:--Xmx2g -Xms1g}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${GRAPHHOPPER_PORT:-8989}:8989"
    volumes:
      - routingdata:/data
      - statusdata:/status
    restart: unless-stopped

  # --- Geocoder: Adress- & Ortssuche (nur mit `--profile geocoding`) ----------
  # Photon-Instanz, die beim ersten Start die pro-Stadt-Geocoder-Häppchen aus dem
  # BaumRadar-Katalog importiert (CITY_FILTER wie beim Loader; je Stadt MB statt
  # 11-GB-Länder-Dumps). Danach läuft die Suche komplett lokal auf :2322.
  photon:
    build:
      context: ./photon
      args:
        PHOTON_VERSION: ${PHOTON_VERSION:-1.2.1}
    container_name: baumradar-photon
    logging: *default-logging
    profiles: ["geocoding"]
    environment:
      CATALOG_URL: ${CATALOG_URL:-https://raw.githubusercontent.com/matthili/BaumRadar/master/docs/data/catalog.json}
      CITY_FILTER: ${CITY_FILTER:-}
      # Heap für den einmaligen Index-Import: viele Städte = viel RAM (19 Städte
      # ≈ 18 GB Rohdaten). Bei Import-Abstürzen in .env erhöhen (z. B. -Xmx6g).
      IMPORT_JAVA_OPTS: ${PHOTON_IMPORT_JAVA_OPTS:--Xmx4g}
      JAVA_OPTS: ${PHOTON_JAVA_OPTS:--Xmx1g}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${PHOTON_PORT:-2322}:2322"
    volumes:
      - photondata:/photon
      - statusdata:/status
      # Liegt das Repo lokal vor, werden Katalog + Geocoder-Häppchen direkt von
      # hier gelesen statt von GitHub geladen (bei Sparse-Checkouts einfach leer).
      - ../docs/data:/local-data:ro
    restart: unless-stopped

volumes:
  pgdata:
  gsdata:
  osmcache:
  routingdata:
  photondata:
  statusdata:

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # GeoServer same-origin durchreichen (kein CORS, identisch zum ng-serve-Proxy)
    location /geoserver/ {
        proxy_pass http://geoserver:8080/geoserver/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # GraphHopper-Routing same-origin (nur aktiv, wenn das Profil "routing" läuft).
    # Variable + Docker-Resolver: nginx startet auch, wenn graphhopper (noch) nicht
    # existiert — dann gibt es pro Anfrage ein 502 statt eines Start-Fehlers.
    location /graphhopper/ {
        resolver 127.0.0.11 valid=10s;
        set $gh_upstream http://graphhopper:8989;
        rewrite ^/graphhopper/(.*)$ /$1 break;
        proxy_pass $gh_upstream;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
        # Custom-Model-Anfragen tragen hunderte Zonen-Polygone als POST-Body —
        # nginx' 1-MB-Default würde lange Routen in dichten Städten mit 413 kappen.
        client_max_body_size 16m;
    }

    # Photon-Geocoder same-origin (nur aktiv, wenn das Profil "geocoding" läuft).
    # Gleiche Variable+Resolver-Mechanik wie beim GraphHopper-Proxy.
    location /photon/ {
        resolver 127.0.0.11 valid=10s;
        set $photon_upstream http://photon:2322;
        rewrite ^/photon/(.*)$ /$1 break;
        proxy_pass $photon_upstream;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    # Live-Status der Lade-Jobs (aus dem geteilten statusdata-Volume).
    # Fehlende Dateien = 404 -> der Client wertet das als "keine Meldung".
    location /status/ {
        alias /webstatus/;
        default_type application/json;
        add_header Cache-Control "no-store";
    }

    # SPA-Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
